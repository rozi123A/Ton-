[build]
  command = "pnpm run build"
  publish = "dist/public"

# Netlify hosts the static frontend; forward backend traffic to the Render app.
# Keep these proxy rules before the SPA fallback so API requests do not receive index.html.
[[redirects]]
  from = "/api/*"
  to = "https://connectlive-jce9.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/manus-storage/*"
  to = "https://connectlive-jce9.onrender.com/manus-storage/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ping"
  to = "https://connectlive-jce9.onrender.com/ping"
  status = 200
  force = true

# Keep this SPA fallback last; backend rewrites must take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
